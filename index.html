const MODE={en2zh:"英選中",zh2en:"中選英",fill:"填空",battle:"⚔️對戰"};
const KIND={review:"複習",practice:"錯題練習",sprint:"最後衝刺"};
function History({hist}){
  if(!hist.length)return null;
  const days=[];[...hist].sort((a,b)=>b.t-a.t).forEach(h=>{const d=new Date(h.t),k=(d.getMonth()+1)+"月"+d.getDate()+"日";let g=days.find(x=>x.k===k&&x.y===d.getFullYear());if(!g){g={k,y:d.getFullYear(),list:[]};days.push(g)}g.list.push(h)});
  const hm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
  const gs=h=>h.kind==="review"||h.kind==="practice"||h.kind==="self"?"不計分":(h.gain>0?"+":h.gain<0?"−":"+")+Math.abs(h.gain);
  return <div className="box" style={{marginTop:14}}><b>📅 我的測驗紀錄</b><p className="note" style={{margin:"4px 0 0"}}>共玩了 {hist.length} 次，最高 {Math.max(...hist.map(h=>h.correct))} 題答對</p>
  {days.map(g=><div key={g.y+g.k}><div className="dayh"><span>{g.k}</span><span className="note">玩了 {g.list.length} 次</span></div>
    {g.list.map(h=><div className="wr" key={h.t}><span>{hm(h.t)}　{MODE[h.mode]||h.mode}{KIND[h.kind]?"・"+KIND[h.kind]:""}{h.scope?<small className="note">　{h.scope}</small>:null}</span><span><b>{h.correct}</b> / {h.total} 題　<span style={{color:h.gain<0&&h.kind!=="review"?"var(--rd)":"var(--pk)",fontWeight:900}}>{gs(h)}</span></span></div>)}</div>)}</div>}
function Result({r,hist,retry,goCard}){
  if(!r&&!hist.length)return <Empty icon="📊" t="還沒有測驗結果" s="完成一次測驗後，成績會顯示在這裡"/>;
  if(!r)return <div><History hist={hist}/><div className="row"><button className="btn ghost" onClick={goCard}>🃏 返回單字卡</button></div></div>;
  const pct=Math.round(r.correct/r.total*100),sc=r.kind==="score"||r.kind==="sprint";
  return <div><div className="box" style={{textAlign:"center"}}><div style={{fontSize:56}}>{pct===100?"🏆":pct>=60?"🎉":"💪"}</div>
    <b>{sc?"本回 "+(r.gain>=0?"+":"−")+Math.abs(r.gain)+" 分":r.kind==="review"?"複習完成（不計分）":r.kind==="self"?"自我提升完成（不計分）":"錯題練習完成（不計分）"}</b>
    {r.bonus>0&&<div className="note">含十題全對獎勵 +5 分</div>}{r.pen>0&&<div className="note">答錯扣分 −{r.pen} 分</div>}{r.kind==="sprint"&&<div className="note">最後衝刺：未精熟的單字不足 10 個</div>}</div>
  {r.capped&&<div className="fb ok">🎊 今天的積分已達 {DAILY} 分上限，這回提前結束。明天再來玩！</div>}
  <div className="stats"><div className="stat"><b>{r.total}</b>總題數</div><div className="stat"><b style={{color:"var(--gn)"}}>{r.correct}</b>答對</div><div className="stat"><b style={{color:"var(--rd)"}}>{r.total-r.correct}</b>答錯</div><div className="stat"><b>{pct}%</b>正確率</div></div>
  {r.newM&&r.newM.length>0&&<div className="box" style={{marginTop:12}}><b>🎓 本回新精熟的單字</b>{r.newM.map((w,i)=><div className="wr" key={i}><span><b>{w.en}</b> <small className="note">{w.kk}</small></span><span>{w.zh}</span></div>)}</div>}
  <div className="box" style={{marginTop:12}}><b>答錯的單字</b>{r.wrong.length===0?<p className="note">全部答對，太強了！</p>:r.wrong.map((w,i)=><div className="wr" key={i}><span><b>{w.en}</b> <small className="note">{w.kk}</small></span><span>{w.zh}</span></div>)}</div>
  <p className="note" style={{textAlign:"center"}}>答錯的單字已放進「錯題區」，下次答對就會自動移除。</p><div className="row"><button className="btn" onClick={retry}>🔁 重新測驗</button><button className="btn ghost" onClick={goCard}>🃏 返回單字卡</button></div><History hist={hist}/></div>}

function Board({players,meId,ts,onRefresh}){

  if(!ts)return <div>{bar}<div className="empty"><div className="big">🐣</div><b>載入中…</b></div></div>;
  if(!players.length)return <div>{bar}<Empty icon="🏆" t="排行榜還是空的" s="完成測驗拿到分數就會上榜"/></div>;
  return <div>{bar}{players.map((p,i)=><div key={p.id} className={"rk"+(p.id===meId?" me":"")}><div className="n">{["🥇","🥈","🥉"][i]||i+1}</div><Av a={p.animal} score={p.score} size={42}/><div className="nm">{p.name}<small>Lv.{lvOf(p.score)+1} {LV[lvOf(p.score)][1]}</small></div><div className="sc">{p.score||0}</div></div>)}</div>}

function App(){

  const pdoc=()=>firebase.firestore().collection("players").doc(u.uid);

  const saveWords=items=>wr(async()=>{await firebase.firestore().collection("vocab").doc("list").set({items});flash("已更新單字庫")});

    let sc=p.score||0,m={...(p.m||{})},g=g0,d=0,mc,newM=false;
    if(info.ok)ws.delete(info.w.en);else ws.add(info.w.en);
    if(scoring&&info.ok){const add=(info.mode==="fill"?3:2)+(info.bonus?5:0),ga=CAP_ON?Math.max(0,Math.min(add,DAILY-g0)):add,key=mkey(info.w),pc=m[key]||0,c=Math.min(MAST,pc+1);
      sc+=ga;g+=ga;d=ga;m[key]=c;mc=c;newM=pc<MAST&&c>=MAST}
    else if(scoring&&!info.skip&&sc>0){sc-=1;d=-1}
    const np={...p,score:sc,m,wrong:[...ws],daily:{day,g},updated:Date.now()};
    P.current=np;
    wr(()=>pdoc().update({score:np.score,m:np.m,wrong:np.wrong,daily:np.daily,updated:np.updated}));
    return {d,mc,newM,bonus:!!info.bonus,capHit:CAP_ON&&scoring&&g>=DAILY};
  };
  const done=r=>{setRes(r);setTab("result");if(!teacher){const p=P.current||me,sc=qsel.length?qsel.map(x=>x==="__wrong"?"錯題區":x).join("、"):"全部",
      h=[...(p.history||[]),{t:Date.now(),mode:r.mode,...(r.kind&&r.kind!=="score"?{kind:r.kind}:{}),correct:r.correct,total:r.total,gain:r.gain,scope:sc.slice(0,40)}].slice(-200),q=(p.quizzes||0)+(r.kind==="self"?0:1);
    P.current={...p,history:h,quizzes:q};wr(()=>pdoc().update({history:h,quizzes:q,updated:Date.now()}))}};
  const finishBattle=info=>{if(teacher||!me)return;
    const p=P.current||me,day=dayKey(),b=p.battle&&p.battle.day===day?p.battle:{day,n:0,pairs:{}},pc=(b.pairs&&b.pairs[info.opp])||0,g0=dayGain(p);
    const capped=b.n>=5||pc>=2||(CAP_ON&&g0>=DAILY),raw=capped?0:(info.res==="win"?5:info.res==="draw"?3:1),gain=CAP_ON?Math.max(0,Math.min(raw,DAILY-g0)):raw;
    const nb={day,n:b.n+(capped?0:1),pairs:{...(b.pairs||{}),[info.opp]:pc+(capped?0:1)},last:{id:info.id,gain,capped}};
    const ws=new Set(p.wrong||[]);info.rights.forEach(e=>ws.delete(e));info.wrongs.forEach(e=>ws.add(e));
    const h=[...(p.history||[]),{t:Date.now(),mode:"battle",correct:info.correct,total:10,gain,scope:("對戰 "+info.oppName).slice(0,40)}].slice(-200);
    const np={...p,score:(p.score||0)+gain,battle:nb,wrong:[...ws],history:h,daily:{day,g:g0+gain},updated:Date.now()};
    P.current=np;wr(()=>pdoc().update({score:np.score,battle:nb,wrong:np.wrong,history:h,daily:np.daily,updated:np.updated}))};
  const L=lvOf(me?me.score:0);
  const wrongList=((me&&me.wrong)||[]).map(e=>words.find(w=>w.en===e)).filter(Boolean);
  const sets=[...new Set(words.map(w=>w.set||"未分類"))];
  const sv=sel==="__wrong"?(wrongList.length?sel:"*"):(sel==="*"||sets.includes(sel)?sel:"*");
  const scoped=sv==="*"?uniq(words):sv==="__wrong"?wrongList:words.filter(w=>(w.set||"未分類")===sv);
  const picker=<ScopeSel sets={sets} sel={sv} setSel={setSel} wn={wrongList.length}/>;
  const qv=qsel.filter(x=>x==="__wrong"?wrongList.length>0:sets.includes(x));
  const qScoped=qv.length===0?uniq(words):uniq([...qv.includes("__wrong")?wrongList:[],...words.filter(w=>qv.includes(w.set||"未分類"))]);
  const mm=(me&&me.m)||{},allW=uniq(words),stat={__all:{t:allW.length,u:allW.filter(w=>!isM(mm,w)).length}};
  sets.forEach(x=>{const ws=uniq(words.filter(w=>(w.set||"未分類")===x));stat[x]={t:ws.length,u:ws.filter(w=>!isM(mm,w)).length}});
  const qU=qScoped.filter(w=>!isM(mm,w)).length,practice=qv.length===1&&qv[0]==="__wrong",gToday=dayGain(me),capped=CAP_ON&&!teacher&&gToday>=DAILY;
  const qpicker=<MultiScope sets={sets} sel={qv} setSel={setQsel} wn={wrongList.length} total={qScoped.length} stat={stat} u={qU}/>;
  const spicker=<MultiScope sets={sets} sel={qv} setSel={setQsel} wn={wrongList.length} total={qScoped.length} stat={stat} u={qU} self incl={incl}/>;
  const bpicker=<MultiScope sets={sets} sel={qv} setSel={setQsel} wn={wrongList.length} total={qScoped.length} stat={stat} u={qU} battle/>;
  const tabs=[["card","🃏","單字卡"],["quiz","📝","測驗"],["wrong","📕","錯題區"],["result","📊","結果"],["board","🏆","排行榜"],...(teacher?[["teach","👩‍🏫","教師"]]:[])];
  let body;
  if(u===undefined||(u&&!ml))body=<div className="empty" style={{paddingTop:120}}><div className="big">🐣</div><b>載入中…</b></div>;
  else if(!u)body=<Login flash={flash}/>;
  else if(!me||edit)body=<Setup init={me} onSave={saveMe} onCancel={me?()=>setEdit(false):null}/>;
  else body=<div className="app">
    <header><div className="who"><button style={{border:0,background:"none",padding:0,cursor:"pointer"}} onClick={()=>!teacher&&setEdit(true)} aria-label="編輯帳號"><Av a={me.animal} score={me.score} size={50}/></button>
      <div><b>{me.name}</b><div className="lv">Lv.{L+1} {LV[L][1]}</div><button className="chip" onClick={()=>setHelp(true)}>稱號說明</button></div></div>
      <div style={{textAlign:"right"}}><span className="pts">⭐ {me.score||0}</span><div><button className="chip" onClick={()=>firebase.auth().signOut()}>登出</button></div></div></header>
    {tab==="card"&&<Cards words={scoped} picker={picker} teacher={teacher} goTeach={()=>setTab("teach")}/>}
    {tab==="quiz"&&(bt?<Battle me={me} uid={u.uid} isT={teacher} words={words} qScoped={qScoped} qpicker={bpicker} capped={capped} bcode={bcode} setBcode={setBcode} onFinish={finishBattle} onExit={()=>{setBt(false)}} flash={flash}/>
      :<Quiz key={(auto?auto.t:0)+(sp?"s":"")} words={words} scoped={qScoped} m={mm} practice={practice} wrongList={wrongList} capped={capped} gToday={gToday} sel={qv} stat={stat} picker={sp?spicker:qpicker} self={sp} incl={incl} setIncl={setIncl} onBack={()=>setSp(false)} onSelf={()=>setSp(true)} onAnswer={answer} auto={auto&&auto.m} onBattle={()=>{setSp(false);setBt(true)}} onDone={r=>{setAuto(null);done(r)}}/>)}
    {tab==="wrong"&&<Wrong list={wrongList} go={t=>{if(t==="quiz")setQsel(["__wrong"]);else setSel("__wrong");setTab(t)}}/>}
    {tab==="result"&&<Result r={res} hist={me.history||[]} retry={()=>{setBt(false);setSp(res.kind==="self");setAuto({m:res.mode,t:Date.now()});setTab("quiz")}} goCard={()=>setTab("card")}/>}
    {tab==="board"&&<Board players={players.filter(p=>p.seat)} meId={u.uid} ts={pts} onRefresh={loadPlayers}/>}
    {tab==="teach"&&teacher&&<Teach words={words} save={saveWords} flash={flash} players={players} reload={loadPlayers}/>}
    <nav><div>{tabs.map(([k,e,n])=><button key={k} className={tab===k?"on":""} onClick={()=>setTab(k)}><span>{e}</span>{n}</button>)}</div></nav>
    {help&&<div className="mask" onClick={()=>setHelp(false)}><div className="modal" onClick={e=>e.stopPropagation()}><h3 style={{marginTop:0}}>稱號說明</h3>
      {LV.map((l,i)=><div className="wr" key={i} style={i===L?{background:"var(--pk2)",borderRadius:12,padding:"9px 8px"}:null}><span>{l[2]} Lv.{i+1} {l[1]}</span><span className="note">{l[3]}</span></div>)}
      <p className="note" style={{lineHeight:1.7}}>答對一題 +2 分（填空題 +3 分），十題全對再 +5 分；答錯 −1 分（最低 0 分），按「我不知道」不扣分。<br/>同一個單字累計答對 3 次就「精熟」，之後不再出題、不加分；範圍內的字都精熟後會進入複習模式（不計分）。{CAP_ON&&<span><br/>每天最多獲得 {DAILY} 分，達到上限請明天再來。</span>}</p><button className="btn big" onClick={()=>setHelp(false)}>知道了</button></div></div>}</div>;
  return <div>{body}{toast&&<div className="toast">{toast}</div>}</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
